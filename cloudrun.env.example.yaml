# Contoh variabel non-rahasia untuk Cloud Run. Biasanya tidak perlu diisi manual: scripts/deploy-cloudrun.mjs
# membuat cloudrun.env.yaml dari .env. Kalau deploy manual, salin ke cloudrun.env.yaml (di-gitignore), isi, lalu
#   gcloud run deploy ... --env-vars-file cloudrun.env.yaml
# Rahasia (DATABASE_URL, JWT_SECRET, GEMINI_API_KEY, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, YT_TRANSCRIPT_IO_TOKEN) masuk lewat
# Secret Manager (--set-secrets), bukan file ini. Salin nilainya dari Variables di Railway.
CORS_ORIGIN: "https://www.ai-signify.com,https://ai-signify.com"
AI_ENABLED: "true"
GEMINI_VERTEX: "true"
VERTEX_PROJECT: "<project id Vertex AI>"
VERTEX_LOCATION: "global"
LIVEKIT_URL: "wss://<project>.livekit.cloud"
GOOGLE_CLIENT_ID: "<client id>.apps.googleusercontent.com"
ADMIN_EMAILS: "<email admin, pisahkan dengan koma>"
# Opsional, hanya bila di Railway diisi selain default:
# JWT_EXPIRES_IN: "7d"
# GEMINI_MODEL: "gemini-3.5-flash"
# LIVE_TRANSCRIBE_MODEL: "gemini-3.5-transcribe-live"
# TTS_MODEL: "gemini-3.8-flash-tts"
# POSE_PROVIDER, SIGN_MT_URL, SIGNGPT_URL, POSE_API_LANGUAGES, SIGN_MODEL_URL
